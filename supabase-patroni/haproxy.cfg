# =============================================================================
# HAProxy Configuration for Supabase Patroni Cluster
# =============================================================================

global
    maxconn 1000
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s

# =============================================================================
# Frontend: Read-Write Traffic (Primary Only)
# =============================================================================
frontend postgres_rw
    bind *:5000
    default_backend postgres_primary

# =============================================================================
# Frontend: Read-Only Traffic (All Replicas)
# =============================================================================
frontend postgres_ro
    bind *:5001
    default_backend postgres_replicas

# =============================================================================
# Backend: Primary Node
# Uses Patroni REST API to detect primary
# =============================================================================
backend postgres_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# =============================================================================
# Backend: Replica Nodes
# Uses Patroni REST API to detect replicas
# =============================================================================
backend postgres_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# =============================================================================
# Stats Interface
# =============================================================================
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats admin if LOCALHOST
