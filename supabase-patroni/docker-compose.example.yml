# =============================================================================
# Example Docker Compose for Supabase Patroni Cluster
# =============================================================================
#
# This creates a 3-node PostgreSQL HA cluster with:
# - 3 etcd nodes for distributed consensus
# - 3 Patroni nodes (1 primary, 2 replicas)
# - HAProxy for load balancing
#
# Usage:
#   docker-compose -f docker-compose.example.yml up -d
#
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # etcd Cluster (Distributed Configuration Store)
  # ===========================================================================
  etcd1:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd1
    hostname: etcd1
    command:
      - etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=supabase-etcd-cluster
    networks:
      - supabase-patroni
    volumes:
      - etcd1_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  etcd2:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd2
    hostname: etcd2
    command:
      - etcd
      - --name=etcd2
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=supabase-etcd-cluster
    networks:
      - supabase-patroni
    volumes:
      - etcd2_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  etcd3:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd3
    hostname: etcd3
    command:
      - etcd
      - --name=etcd3
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=supabase-etcd-cluster
    networks:
      - supabase-patroni
    volumes:
      - etcd3_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # Patroni Nodes (PostgreSQL HA)
  # ===========================================================================
  patroni1:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabase-patroni:latest
    container_name: patroni1
    hostname: patroni1
    environment:
      PATRONI_NAME: patroni1
      PATRONI_SCOPE: supabase-ha
      PATRONI_ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
    ports:
      - "5432:5432"
      - "8008:8008"
    networks:
      - supabase-patroni
    volumes:
      - patroni1_data:/home/postgres/pgdata
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  patroni2:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabase-patroni:latest
    container_name: patroni2
    hostname: patroni2
    environment:
      PATRONI_NAME: patroni2
      PATRONI_SCOPE: supabase-ha
      PATRONI_ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
    ports:
      - "5433:5432"
      - "8009:8008"
    networks:
      - supabase-patroni
    volumes:
      - patroni2_data:/home/postgres/pgdata
    depends_on:
      patroni1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  patroni3:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabase-patroni:latest
    container_name: patroni3
    hostname: patroni3
    environment:
      PATRONI_NAME: patroni3
      PATRONI_SCOPE: supabase-ha
      PATRONI_ETCD_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl_secure_password}
    ports:
      - "5434:5432"
      - "8010:8008"
    networks:
      - supabase-patroni
    volumes:
      - patroni3_data:/home/postgres/pgdata
    depends_on:
      patroni1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # HAProxy (Load Balancer)
  # ===========================================================================
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    hostname: haproxy
    ports:
      - "5000:5000"   # Read-Write (Primary)
      - "5001:5001"   # Read-Only (Replicas)
      - "7000:7000"   # HAProxy Stats
    networks:
      - supabase-patroni
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - patroni1
      - patroni2
      - patroni3

networks:
  supabase-patroni:
    driver: bridge

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  patroni1_data:
  patroni2_data:
  patroni3_data:
