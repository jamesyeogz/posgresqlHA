# =============================================================================
# HAProxy Configuration for Supabase-Patroni
# =============================================================================
# Ports:
#   5000 - PostgreSQL Primary (Read/Write)
#   5001 - PostgreSQL Replicas (Read-Only)
#   7000 - HAProxy Stats Dashboard
# =============================================================================

global
    maxconn 1000
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    retries 3
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s

# Stats Dashboard - http://localhost:7000/stats
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin

# PostgreSQL Primary (Read/Write)
listen postgres_primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008

# PostgreSQL Replicas (Read-Only)
listen postgres_replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008

