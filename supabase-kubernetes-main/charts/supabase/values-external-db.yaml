# Disabled - using external PostgreSQL HA cluster (Patroni + HAProxy)
db:
  enabled: false

studio:
  image:
    tag: "2025.12.17-sha-43f4f7f"
  environment:
    STUDIO_DEFAULT_ORGANIZATION: "My Organization"
    STUDIO_DEFAULT_PROJECT: "My Project"
    SUPABASE_PUBLIC_URL: http://supabase.local/
    NEXT_PUBLIC_ENABLE_LOGS: "true"
  livenessProbe:
    httpGet:
      path: /api/profile
      port: 3000
    initialDelaySeconds: 3

auth:
  image:
    tag: "v2.184.0"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"
    API_EXTERNAL_URL: http://supabase.local
    GOTRUE_SITE_URL: http://supabase.local
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    GOTRUE_MAILER_AUTOCONFIRM: "true"
    GOTRUE_SMTP_ADMIN_EMAIL: "your-mail@supabase.local"
    GOTRUE_SMTP_HOST: "smtp.supabase.local"
    GOTRUE_SMTP_PORT: "587"
    GOTRUE_SMTP_SENDER_NAME: "your-mail@supabase.local"

rest:
  image:
    tag: "v14.1"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"

realtime:
  image:
    tag: "v2.68.0"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"
    DB_SSL: "false"
    APP_NAME: realtime
    FLY_APP_NAME: realtime
    FLY_ALLOC_ID: local
    SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
  livenessProbe:
    httpGet:
      path: /
      port: 4000
    initialDelaySeconds: 3

meta:
  image:
    tag: "v0.95.1"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"

storage:
  enabled: true
  image:
    tag: "v1.33.0"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"
  livenessProbe:
    httpGet:
      path: /status
      port: 5000
    initialDelaySeconds: 3
  persistence:
    enabled: false

imgproxy:
  image:
    tag: "v3.8.0"
  environment:
    IMGPROXY_ENABLE_WEBP_DETECTION: "true"
  livenessProbe:
    exec:
      command:
        - imgproxy
        - health
    initialDelaySeconds: 3
  persistence:
    enabled: false

kong:
  image:
    repository: kong
    tag: "2.8.1"
  environment:
    KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
    KONG_LOG_LEVEL: info
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    tls: []
    hosts:
      - host: supabase.local
        paths:
          - path: /
            pathType: Prefix

analytics:
  image:
    tag: "1.27.0"
  environment:
    # HAProxy Primary (R/W) endpoint
    DB_HOST: host.docker.internal
    DB_PORT: "5000"
  livenessProbe:
    httpGet:
      path: /health
      port: 4000
    initialDelaySeconds: 3

vector:
  image:
    tag: "0.28.1-alpine"
  livenessProbe:
    httpGet:
      path: /health
      port: 9001
    initialDelaySeconds: 3
  volumeMounts:
    - name: pod-logs
      mountPath: /var/log/pods
  volumes:
    - name: pod-logs
      hostPath:
        path: /var/log/pods

functions:
  enabled: false
  image:
    tag: "v1.69.28"
  environment:
    DB_HOST: host.docker.internal
    DB_PORT: "5000"
